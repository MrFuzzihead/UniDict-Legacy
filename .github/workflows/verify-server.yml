name: Verify (dedicated server)

# Headless half of T3 (docs/TestPlan.md §T3 automation): boots the dev dedicated server, runs the
# [unidict-verify] stage-1 + stage-2 oracle and asserts the captured console. No display, no client.
# The task prepares run/server/ (EULA + headless server.properties) and stops the JVM after stage 2.

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches .java-version / gradle-daemon-jvm.properties (toolchainVersion=25).
          java-version: '25'
          cache: gradle

      - name: Run the headless verify harness
        run: ./gradlew verifyServer --no-daemon --stacktrace

      - name: Upload the captured harness log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unidict-verify-server
          path: build/unidict-verify-server.log
          if-no-files-found: warn
