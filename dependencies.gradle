/*
 * Add your dependencies here. Supported configurations:
 *  - api("group:name:version:classifier"): if you use the types from this dependency in the public API of this mod
 *       Available at runtime and compiletime for mods depending on this mod
 *  - implementation("g:n:v:c"): if you need this for internal implementation details of the mod, but none of it is visible via the public API
 *       Available at runtime but not compiletime for mods depending on this mod
 *  - compileOnly("g:n:v:c"): if the mod you're building doesn't need this dependency during runtime at all, e.g. for optional mods
 *       Not available at all for mods depending on this mod, only visible at compiletime for this mod
 *  - compileOnlyApi("g:n:v:c"): like compileOnly, but also visible at compiletime for mods depending on this mod
 *       Available at compiletime but not runtime for mods depending on this mod
 *  - runtimeOnlyNonPublishable("g:n:v:c"): if you want to include a mod in this mod's runClient/runServer runs, but not publish it as a dependency
 *       Not available at all for mods depending on this mod, only visible at runtime for this mod
 *  - devOnlyNonPublishable("g:n:v:c"): a combination of runtimeOnlyNonPublishable and compileOnly for dependencies present at both compiletime and runtime,
 *       but not published as Maven dependencies - useful for RFG-deobfuscated dependencies or local testing
 *  - runtimeOnly("g:n:v:c"): if you don't need this at compile time, but want it to be present at runtime
 *       Available at runtime for mods depending on this mod
 *  - annotationProcessor("g:n:v:c"): mostly for java compiler plugins, if you know you need this, use it, otherwise don't worry
 *  - testCONFIG("g:n:v:c") - replace CONFIG by one of the above (except api), same as above but for the test sources instead of main
 *
 *  - shadowImplementation("g:n:v:c"): effectively the same as API, but the dependency is included in your jar under a renamed package name
 *       Requires you to enable usesShadowedDependencies in gradle.properties
 *
 *  - compile("g:n:v:c"): deprecated, replace with "api" (works like the old "compile") or "implementation" (can be more efficient)
 *
 * You can exclude transitive dependencies (dependencies of the chosen dependency) by appending { transitive = false } if needed,
 * but use this sparingly as it can break using your mod as another mod's dependency if you're not careful.
 *
 * To depend on obfuscated jars you can use `devOnlyNonPublishable(rfg.deobf("dep:spec:1.2.3"))` to fetch an obfuscated jar from maven,
 * or `devOnlyNonPublishable(rfg.deobf(project.files("libs/my-mod-jar.jar")))` to use a file.
 *
 * Gradle names for some of the configuration can be misleading, compileOnlyApi and runtimeOnly both get published as dependencies in Maven, but compileOnly does not.
 * The buildscript adds runtimeOnlyNonPublishable to also have a runtime dependency that's not published.
 *
 * For more details, see https://docs.gradle.org/8.0.1/userguide/java_library_plugin.html#sec:java_library_configurations_graph
 */
dependencies {
    // The default dev runtime is the full stack. Pass -PunidictDevLight for a focused IC2/EtF runtime:
    // the heavy optional integrations move from devOnlyNonPublishable to compileOnly, so they still
    // compile (including the TE @Invoker Mixins) but do not drag CoFH Core onto the runtime classpath.
    // Full-stack client runs need the dev-only AT in src/main/resources/META-INF/unidict_at.cfg
    // (gitignored) or the production pack's equivalent World.collidingBoundingBoxes widening; the
    // server verify/game-test tasks do not tick item entities. Do not use -PunidictDevLight with
    // gameTestServer/verifyServer: their required integrations would be absent by design.
    def devLight = project.hasProperty("unidictDevLight")
    def heavy = { String notation -> devLight ? compileOnly(notation) : devOnlyNonPublishable(notation) }

    devOnlyNonPublishable("com.github.GTNewHorizons:NotEnoughItems:2.9.4-GTNH:dev")
    devOnlyNonPublishable("com.github.GTNewHorizons:CodeChickenCore:1.4.22:dev")
    heavy("com.github.GTNewHorizons:Mantle:0.5.4:dev")
    // Railcraft's POM pulls thaumcraft:Thaumcraft:1.7.10-4.2.3.5 from gregtech.overminddl1.com, which is
    // unreachable/flaky on CI and times out the :runtimeClasspath resolution. UniDict never references
    // Thaumcraft (no imports), so the whole group is excluded to keep the build resolvable.
    def railcraft = heavy("com.github.GTNewHorizons:Railcraft:9.18.0:dev")
    railcraft.exclude group: "thaumcraft"
    heavy("com.github.GTNewHorizons:TinkersConstruct:1.15.0-GTNH:dev")
    heavy("com.github.GTNewHorizons:ForestryMC:4.12.0:dev")
    heavy("com.github.GTNewHorizons:EnderCore:0.5.15:dev")
    heavy("com.github.GTNewHorizons:EnderIO:2.11.0:dev")
    heavy("curse.maven:ThermalExpansion-69163:2388759")
    heavy("curse.maven:ThermalFoundation-222880:2388753")
    compileOnly("curse.maven:ImmersiveEngineering-231951:2299020")
    // Galacticraft's POM pulls GregTech (GT5-Unofficial) transitively; that GT jar replaces IC2 machine
    // behavior (incl. the macerator) and confounds IC2 testing, so exclude it. TinkersConstruct is
    // likewise excluded here; the direct TiC dependency above supplies the supported version.
    def galacticraft = heavy("com.github.GTNewHorizons:Galacticraft:3.5.0-GTNH:dev")
    galacticraft.exclude module: "GT5-Unofficial"
    galacticraft.exclude module: "TinkersConstruct"
    heavy("com.github.GTNewHorizons:Applied-Energistics-2-Unofficial:rv3-beta-1099-GTNH:dev") // also pulls cofh-core transitively
    devOnlyNonPublishable("net.industrial-craft:industrialcraft-2:2.2.828-experimental:dev")
    runtimeOnlyNonPublishable("ganymedes01.etfuturum:Et-Futurum-Requiem:2.7.0-GTNH:dev")
    devOnlyNonPublishable("com.github.GTNewHorizons:StorageDrawers:2.3.0-GTNH:dev")

    // IC2 on the test classpath (M6 T2): the IC2 machine-rewrite seam uses the real ic2.api.recipe
    // RecipeOutput type (logic that touches the type but not statics — docs/PLAN.md §0 T2), mirroring
    // how the Furnace T2 test uses MC Item/ItemStack types.
    testImplementation("net.industrial-craft:industrialcraft-2:2.2.828-experimental:dev")

    // JVM test stack. JUnit 5 stays the project's platform; Mockito 4.11.0 is the last 4.x line and
    // runs on the Java 8 toolchain the mod targets (Mockito 5 needs Java 11). mockito-inline lets tests
    // mock final Minecraft classes without changing production code.
    testImplementation(platform("org.junit:junit-bom:5.14.4"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testImplementation("org.mockito:mockito-core:4.11.0")
    testImplementation("org.mockito:mockito-inline:4.11.0")
}
